name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lint, format and types run on one Python version: the tools format and infer slightly
  # differently between their own releases, and older Pythons get older releases.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Python 3.9 is past end of life and has no build for the newest runner image.
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # tests/test_live.py runs against the real API in test mode when this secret exists,
      # and is skipped when it does not (forks, or before the secret is added).
      - run: pytest
        env:
          AVATCADO_TEST_API_KEY: ${{ secrets.AVATCADO_TEST_API_KEY }}
